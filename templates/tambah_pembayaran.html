{% extends "base.html" %}
{% block title %}Tambah Pembayaran{% endblock %}

{% block content %}
<h2 class="mb-4">Tambah Data Pembayaran</h2>

<form method="POST">
    <div class="mb-3">
        <label for="nis" class="form-label">Siswa</label>
        <select class="form-select" id="nis" name="nis" required>
            <option value="">Pilih Siswa</option>
            {% for s in siswa %}
            <option value="{{ s.nis }}">{{ s.nis }} - {{ s.nama }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="id_spp" class="form-label">SPP</label>
        <select class="form-select" id="id_spp" name="id_spp" required>
            <option value="">Pilih SPP</option>
            {% for s in spp %}
            <option value="{{ s.id }}">{{ s.tahun_ajaran }} - Rp {{ "{:,.0f}".format(s.nominal) }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="bulan" class="form-label">Bulan</label>
        <select class="form-select" id="bulan" name="bulan" required>
            <option value="Januari">1. Januari</option>
            <option value="Februari">2. Februari</option>
            <option value="Maret">3. Maret</option>
            <option value="April">4. April</option>
            <option value="Mei">5. Mei</option>
            <option value="Juni">6. Juni</option>
            <option value="Juli">7. Juli</option>
            <option value="Agustus">8. Agustus</option>
            <option value="September">9. September</option>
            <option value="Oktober">10. Oktober</option>
            <option value="November">11. November</option>
            <option value="Desember">12. Desember</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="tahun" class="form-label">Tahun</label>
        <input type="text" class="form-control" id="tahun" name="tahun" required>
    </div>
    <div class="mb-3">
        <label for="tanggal_bayar" class="form-label">Tanggal Bayar</label>
        <input type="date" class="form-control" id="tanggal_bayar" name="tanggal_bayar" required>
    </div>
    <div class="mb-3">
        <label for="jumlah" class="form-label">Jumlah SPP Wajib / Beri 0 Jika Tidak Terikat SPP Wajib</label>
        <input type="number" class="form-control" id="jumlah" name="jumlah" required>
    </div>
    <div class="mb-3">
        <label for="metode_pembayaran" class="form-label">Metode Pembayaran</label>
        <select class="form-select" id="metode_pembayaran" name="metode_pembayaran">
            <option value="tunai">Tunai</option>
            <option value="transfer">Transfer</option>
            <option value="lainnya">Lainnya</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select class="form-select" id="status" name="status">
            <option value="lunas">Lunas</option>
            <option value="belum lunas">Belum Lunas</option>
            <option value="cicil">Cicil</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="keterangan" class="form-label">Keterangan</label>
        <textarea class="form-control" id="keterangan" name="keterangan" rows="3"></textarea>
    </div>
    <!-- Tambahkan setelah form utama -->
    <div class="mb-3">
        <h5>Pembayaran Tambahan</h5>
        <div class="row">
            <div class="col-md-3">
                <label class="form-label">Day Care</label>
                <input type="number" class="form-control" name="daycare" value="0">
            </div>
            <div class="col-md-3">
                <label class="form-label">Extend Hour</label>
                <input type="number" class="form-control" name="extend_hour" value="0">
            </div>
            <div class="col-md-3">
                <label class="form-label">Ekstrakurikuler</label>
                <input type="number" class="form-control" name="excul" value="0">
            </div>
            <div class="col-md-3">
                <label class="form-label">Bimbel</label>
                <input type="number" class="form-control" name="bimbel" value="0">
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Simpan</button>
    <a href="{{ url_for('pembayaran') }}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
