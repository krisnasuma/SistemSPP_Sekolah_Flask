{% extends "base.html" %}
{% block title %}Edit Kelas{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h4>Edit Data Kelas</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nama Kelas</label>
                <input type="text" class="form-control" name="nama_kelas" value="{{ kelas.nama_kelas }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tingkat</label>
                <select class="form-select" name="tingkat" required>
                    <option value="REGULER" {% if kelas.tingkat == 'REGULER' %}selected{% endif %}>REGULER</option>
                    <option value="PRE-SCHOOL" {% if kelas.tingkat == 'PRE-SCHOOL' %}selected{% endif %}>PRE-SCHOOL</option>
                    <option value="DAYCARE" {% if kelas.tingkat == 'DAYCARE' %}selected{% endif %}>DAYCARE</option>
                    <option value="TK A" {% if kelas.tingkat == 'TK A' %}selected{% endif %}>TK A</option>
                    <option value="TK B" {% if kelas.tingkat == 'TK B' %}selected{% endif %}>TK B</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Wali Kelas</label>
                <input type="text" class="form-control" name="wali_kelas" value="{{ kelas.wali_kelas }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Keterangan</label>
                <textarea class="form-control" name="keterangan" rows="2">{{ kelas.keterangan }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
            <a href="{{ url_for('kelas') }}" class="btn btn-secondary">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
