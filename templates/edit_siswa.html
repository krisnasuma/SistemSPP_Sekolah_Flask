{% extends "base.html" %}
{% block title %}Edit Siswa{% endblock %}

{% block content %}
<h2 class="mb-4">Edit Data Siswa</h2>

<form method="POST">
    <div class="mb-3">
        <label for="nis" class="form-label">NIS</label>
        <input type="text" class="form-control" id="nis" name="nis" value="{{ siswa.nis }}" readonly>
    </div>
    <div class="mb-3">
        <label for="nama" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="nama" name="nama" value="{{ siswa.nama }}" required>
    </div>
    <div class="mb-3">
        <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
        <select class="form-select" id="jenis_kelamin" name="jenis_kelamin" required>
            <option value="L" {% if siswa.jenis_kelamin == 'L' %}selected{% endif %}>Laki-laki</option>
            <option value="P" {% if siswa.jenis_kelamin == 'P' %}selected{% endif %}>Perempuan</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="tanggal_lahir" class="form-label">Tanggal Lahir</label>
        <input type="date" class="form-control" id="tanggal_lahir" name="tanggal_lahir" value="{{ siswa.tanggal_lahir }}">
    </div>
    <div class="mb-3">
        <label for="alamat" class="form-label">Alamat</label>
        <textarea class="form-control" id="alamat" name="alamat" rows="3">{{ siswa.alamat }}</textarea>
    </div>
    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select class="form-select" id="status" name="status" required>
            <option value="aktif" {% if siswa.status == 'aktif' %}selected{% endif %}>Aktif</option>
            <option value="non-aktif" {% if siswa.status == 'non-aktif' %}selected{% endif %}>Non-Aktif</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Kelas</label>
        <select class="form-select" name="kelas_id">
            <option value="">-- Pilih Kelas --</option>
            {% for k in kelas %}
            <option value="{{ k.id }}" 
                    {% if (siswa and siswa.kelas_id == k.id) or request.form.get('kelas_id') == k.id|string %}selected{% endif %}>
                {{ k.nama_kelas }} ({{ k.tingkat }})
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
    <a href="{{ url_for('siswa') }}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
