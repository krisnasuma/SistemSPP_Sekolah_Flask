{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h2 class="mb-4">Dashboard Admin</h2>

<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Total Siswa</h5>
                <p class="card-text display-6">{{ total_siswa }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Total Pembayaran</h5>
                <p class="card-text display-6">{{ total_pembayaran }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3">
            <div class="card-body">
                <h5 class="card-title">Layanan SPP</h5>
                <p class="card-text display-6">{{ total_spp }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
