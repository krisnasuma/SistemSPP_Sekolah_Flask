{% extends "base.html" %}
{% block title %}Tambah Siswa{% endblock %}

{% block content %}
<h2 class="mb-4">Tambah Data Siswa</h2>

<form method="POST">
    <div class="mb-3">
        <label for="nis" class="form-label">NIS</label>
        <input type="text" class="form-control" id="nis" name="nis" required>
    </div>
    <div class="mb-3">
        <label for="nama" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="nama" name="nama" required>
    </div>
    <div class="mb-3">
        <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
        <select class="form-select" id="jenis_kelamin" name="jenis_kelamin" required>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="tanggal_lahir" class="form-label">Tanggal Lahir</label>
        <input type="date" class="form-control" id="tanggal_lahir" name="tanggal_lahir">
    </div>
    <div class="mb-3">
        <label for="alamat" class="form-label">Alamat</label>
        <textarea class="form-control" id="alamat" name="alamat" rows="3"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Kelas</label>
        <select class="form-select" name="kelas_id">
            <option value="">-- Pilih Kelas --</option>
            {% for k in kelas %}
            <option value="{{ k.id }}" 
                    {% if (siswa and siswa.kelas_id == k.id) or request.form.get('kelas_id') == k.id|string %}selected{% endif %}>
                {{ k.nama_kelas }} ({{ k.tingkat }})
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Simpan</button>
    <a href="{{ url_for('siswa') }}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
